<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f564a"><title>Travel V1.2 · Madère 2026</title><style>html,body{margin:0;background:#f5f7f4;color:#173128;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}.loading{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}.loading b{font-size:1.4rem}</style></head><body><div class="loading"><div><b>Travel · Madère 2026</b><p>Chargement…</p></div></div><script>

const js=`<script>(function(){document.title='Travel V1.2 · Madère 2026';const ds=[...document.querySelectorAll('.day')];
fetch('${photoData}',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('photo data '+r.status);return r.text()}).then(t=>{const src='data:image/jpeg;base64,'+t.replace(/\\s/g,'');ds.forEach((d,i)=>{const p=d.querySelector('.photo');if(!p)return;p.innerHTML='';p.style.backgroundImage='url("'+src+'")';p.style.backgroundPosition='center '+(i*100/16)+'%';});}).catch(e=>{ds.forEach(d=>{const p=d.querySelector('.photo');if(p)p.innerHTML='<div class="photo-error">📷 Erreur chargement photo locale</div>';});});
ds.forEach(d=>{const h=d.querySelector('.head');if(h&&!h.querySelector('.v12actions')){const a=document.createElement('div');a.className='v12actions';a.innerHTML='<button type="button">Voir / masquer les détails</button><a href="#top">↑ Haut</a>';a.querySelector('button').onclick=()=>d.classList.toggle('vcollapsed');h.appendChild(a);}});const nav=document.querySelector('.nav')||document.querySelector('nav');const box=document.createElement('section');box.className='v12dash';box.innerHTML='<div class="v12box"><div class="v12head"><div><small>ACCÈS RAPIDE</small><h2>Votre séjour en un geste</h2></div><button class="today">📍 Aujourd’hui</button></div><div class="v12stats"><div><b>17</b><span>journées</span></div><div><b>2</b><span>hôtels</span></div><div><b>3–4</b><span>sports / sem.</span></div><div><b>12–24</b><span>demi-pension</span></div></div><div class="filters"><button class="on" data-f="all">Tout</button><button data-f="famille">👨‍👩‍👧 Famille</button><button data-f="couple">❤️ À deux</button><button data-f="sport">🏃 Sport</button></div><p class="halfboard-note">Du 12 au 24 août : petit-déjeuner et dîner au Dreams ; restaurants locaux surtout le midi et pendant les excursions.</p></div>';if(nav)nav.after(box);else document.body.prepend(box);const bs=[...box.querySelectorAll('.filters button')];bs.forEach(b=>b.onclick=()=>{bs.forEach(x=>x.classList.remove('on'));b.classList.add('on');const f=b.dataset.f;ds.forEach(d=>{const t=d.innerText.toLowerCase();let ok=f==='all'||(f==='famille'&&t.includes('famille'))||(f==='couple'&&(t.includes('couple')||t.includes('à deux')))||(f==='sport'&&(t.includes('crossfit')||t.includes('run ')||t.includes('trail')||t.includes('randonnée')));d.classList.toggle('vhide',!ok);});});box.querySelector('.today').onclick=()=>{ds.forEach(d=>d.classList.remove('vhide'));bs.forEach(x=>x.classList.remove('on'));bs[0].classList.add('on');const n=new Date(),num=(n.getFullYear()===2026&&n.getMonth()===7&&n.getDate()>=8&&n.getDate()<=24)?n.getDate()-7:1;document.getElementById('day-'+num)?.scrollIntoView({behavior:'smooth',block:'start'});};})();<\/script>`;
fetch(base,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('base');return r.text()}).then(h=>{h=h.replaceAll('V1.1','V1.2').replace('</head>',css+'</head>').replace('</body>',js+'</body>');document.open();document.write(h);document.close();}).catch(()=>{document.body.innerHTML='<div class="loading"><div><b>Travel est temporairement indisponible.</b><p>Recharge la page dans quelques secondes.</p></div></div>';});
</script></body></html>
