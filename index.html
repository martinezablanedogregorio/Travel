<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f564a"><title>Travel V1.2 · Madère 2026</title></head><body style="margin:0;background:#f5f7f4"><script src="site/part-0.js"></script><script src="site/part-1.js"></script><script src="site/part-2.js"></script><script src="site/part-3.js"></script><script src="site/part-4.js"></script><script>if(window.__travelParts&&window.__travelParts.length==5){let h=window.__travelParts.join('');const photoPatch=`<script>(function(){const ds=[...document.querySelectorAll('.day')];fetch('/Travel/assets/days-sprite.txt?v=12',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('photo '+r.status);return r.text()}).then(t=>{const src='data:image/jpeg;base64,'+t.replace(/\\s/g,'');ds.forEach((d,i)=>{const p=d.querySelector('.day-photo');if(!p)return;const im=p.querySelector('img');if(im)im.style.display='none';p.classList.remove('photo-fallback');p.style.backgroundImage='url("'+src+'")';p.style.backgroundRepeat='no-repeat';p.style.backgroundSize='100% 1700%';p.style.backgroundPosition='center '+(i*100/16)+'%';});}).catch(()=>{ds.forEach(d=>{const p=d.querySelector('.day-photo');if(p)p.innerHTML='<div style="display:grid;place-items:center;height:100%;padding:20px;text-align:center;color:#9a2d24;font-weight:800;background:#fff1ef">📷 Erreur chargement du sprite photo local</div>';});});})();<\/script>`;h=h.replace('</body>',photoPatch+'</body>');document.open();document.write(h);document.close();}else{document.body.innerHTML='<div style="font:700 18px sans-serif;padding:30px">Erreur de chargement local Travel</div>';}</script></body></html>
