const css=`<style>:root{--v12:#173128;--v12b:#245b4c}.hero{min-height:52vh!important;position:relative}.hero:after{content:'V1.2';position:absolute;top:18px;right:18px;background:#fff;color:#173128;padding:7px 10px;border-radius:999px;font-size:.75rem;font-weight:900}.day-photo{height:320px!important;min-height:320px!important;background:#dfe9e4 center top/540px 4080px no-repeat}.day-photo img{display:none!important}.v12dash{max-width:920px;margin:18px auto 0;padding:0 12px}.v12box{background:linear-gradient(145deg,var(--v12),var(--v12b));color:#fff;border-radius:22px;padding:18px;box-shadow:0 16px 40px #17312825}.v12head{display:flex;justify-content:space-between;align-items:center;gap:10px}.v12head h2{margin:.2rem 0 .7rem;font-size:1.35rem}.today{border:0;border-radius:13px;background:#fff;color:#173128;padding:10px 12px;font-weight:850}.v12stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:10px 0}.v12stats div{background:#ffffff12;border:1px solid #ffffff22;border-radius:12px;padding:9px 5px;text-align:center}.v12stats b{display:block}.v12stats span{font-size:.68rem;opacity:.78}.filters{display:flex;gap:7px;overflow:auto}.filters button{border:1px solid #ffffff30;background:#ffffff12;color:#fff;border-radius:999px;padding:8px 10px;font-size:.77rem;font-weight:800;white-space:nowrap}.filters button.on{background:#fff;color:#173128}.day.vhide{display:none}.day{scroll-margin-top:70px}.v12actions{display:flex;gap:7px;margin-top:12px}.v12actions button,.v12actions a{border:1px solid #dce7e1;background:#fff;color:#173128;border-radius:10px;padding:7px 9px;font-size:.75rem;font-weight:800;text-decoration:none}.day.vcollapsed .day-body{display:none}.halfboard-note{font-size:.8rem;opacity:.82;margin:9px 0 0}@media(max-width:540px){.v12stats{grid-template-columns:repeat(2,1fr)}.v12head{align-items:flex-start}.day-photo{height:320px!important;background-size:540px 4080px}}</style>`;
